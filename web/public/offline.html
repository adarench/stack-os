<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Stack OS</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      img {
        width: 72px;
        height: 72px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #a1a1a1;
        max-width: 320px;
        margin: 0 0 20px;
      }
      button {
        appearance: none;
        border: 1px solid #2a2a2a;
        background: #f5f5f5;
        color: #0a0a0a;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/icons/icon-192.png" alt="Stack OS" />
      <h1>You're offline</h1>
      <p>Stack OS can't reach the network right now. Your work is safe — reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>

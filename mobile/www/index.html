<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Stack OS</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a0a; color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .bars { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
      .bar { width: 64px; height: 12px; border-radius: 6px; background: #f5f5f5; opacity: .85;
        animation: pulse 1.4s ease-in-out infinite; }
      .bar:nth-child(2) { animation-delay: .18s; }
      .bar:nth-child(3) { animation-delay: .36s; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      p { font-size: 14px; color: #a1a1a1; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
      <p>Loading Stack OS…</p>
    </div>
  </body>
</html>
